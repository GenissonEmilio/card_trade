project_id = "duelink"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/recuperar-senha"]
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.email.template.confirmation]
subject = "Confirme seu e-mail · Duelink"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Recupere sua conta · Duelink"
content_path = "./supabase/templates/recovery.html"
