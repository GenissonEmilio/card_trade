 <title id="title">DUELINK — letreiro dourado e círculo ciano</title>
 <desc id="desc">Logo vetorial com o desenho original das sete letras DUELINK em dourado, contorno grafite e branco, sobre um círculo ciano em movimento. Sem cartas ou elo. Fundo transparente.</desc>
