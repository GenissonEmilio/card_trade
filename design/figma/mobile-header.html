.button,.match,.card,.hero-card{position:relative}

/* Angled ribbon controls, with a separate raised icon plate. */
.button,.game,.pill,.filter,.sort,.search-submit{position:relative;background:transparent!important;border-color:transparent!important;box-shadow:none!important;border-radius:0}
.ribbon-base{position:absolute!important;left:0;top:0;width:100%;height:100%;z-index:0!important;pointer-events:none}
.control-label{position:relative;z-index:1;white-space:nowrap}
.ribbon-icon{position:absolute!important;left:-2px;top:-3px;width:46px;height:44px;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.ribbon-badge-shape{position:absolute!important;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ribbon-icon>svg:not(.ribbon-badge-shape){position:relative;z-index:1;fill:#f7f7e8}
.button{padding:0 22px 0 58px;gap:0}
.button .control-label{padding-bottom:2px}
.button:not(.primary) .ribbon-icon>svg:not(.ribbon-badge-shape),.game.active .ribbon-icon>svg:not(.ribbon-badge-shape),.filter .ribbon-icon>svg:not(.ribbon-badge-shape){fill:#270d35}
.nav-actions .button{padding:0 18px 0 46px}.nav-actions .ribbon-icon{width:36px;height:36px;top:-2px}.nav-actions .ribbon-icon>svg:not(.ribbon-badge-shape){width:18px;height:18px}

.filter .ribbon-icon,.sort .ribbon-icon{width:36px;height:40px;top:-2px}

.sort-chevron{position:absolute;right:14px;top:18px;z-index:1}

/* Card footer: status and action align inside the safe area of the pixel frame. */
.card .card-bottom,.mobile .card .card-bottom{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:12px;align-items:center;min-height:60px;padding-top:12px;font-size:11px;line-height:1.4;color:#d6c4e2}
.card .card-bottom>div{white-space:nowrap}
.card .card-add,.mobile .card .card-add{display:flex;align-items:center;justify-content:center;width:44px;height:44px;min-width:44px;padding:0;border:0;margin:0;line-height:1;cursor:pointer}
.card .card-add>svg:not(.ribbon-badge-shape),.mobile .card .card-add>svg:not(.ribbon-badge-shape){width:22px;height:22px;fill:none}
.card .card-add:focus-visible{outline:2px solid #f7f7e8;outline-offset:3px}
